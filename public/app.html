<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Candify</title>
<link id="fav" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="/uv/uv.bundle.js"></script>
<script src="/uv.config.js"></script>
<style>
:root{
--bg:#17091f;--bg2:#1f0e2e;--panel:#2a1340;--panel2:#361a52;--line:#ffffff1a;--line2:#ffffff2e;
--fg:#f6edff;--mut:#f6edffa8;--mut2:#f6edff66;
--acc:#ff4fa3;--acc-ink:#1a0712;--acc2:#5ff2c4;--acc3:#ffe45c;--info:#6c8cff;
--ok:#36d399;--warn:#ffb020;--err:#ff5c7a;
--shadow:0 10px 40px #0007;--radius:16px;--speed:.16s;
}
[data-theme=mint]{--acc:#2fe0ad;--acc2:#ffe45c;--acc3:#ff8bc2;--bg:#07211d;--bg2:#0a2a25;--panel:#103b35;--panel2:#174c44}
[data-theme=blueberry]{--acc:#6c8cff;--acc2:#5ff2c4;--acc3:#ffe45c;--bg:#0b1230;--bg2:#101a42;--panel:#182453;--panel2:#20306b}
[data-theme=lemon]{--acc:#ffc93c;--acc-ink:#2a1f00;--acc2:#ff6fb0;--acc3:#5ff2c4;--bg:#201d06;--bg2:#2a2708;--panel:#3a360d;--panel2:#4a4512}
[data-theme=night]{--acc:#b78cff;--acc2:#5ff2c4;--acc3:#ffe45c;--bg:#0b0b10;--bg2:#121219;--panel:#1a1a24;--panel2:#24242f}
:root[data-mode=light]{--bg:#f4eef9;--bg2:#ece3f5;--panel:#ffffff;--panel2:#f3ecfa;--line:#2a123314;--line2:#2a123326;--fg:#24103a;--mut:#24103a9e;--mut2:#24103a5c;--acc-ink:#fff;--shadow:0 10px 36px #3a1f5522}
:root[data-mode=light][data-theme=lemon]{--acc-ink:#2a1f00}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 14px/1.45 Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none}
input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--acc);color:var(--acc-ink)}
.brand{font-family:Fredoka,sans-serif;font-weight:700}
svg.ic{width:1.15em;height:1.15em;display:block;flex:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
:root[data-motion=off] *{animation-duration:.001ms!important;transition-duration:.001ms!important}

/* ---- tab strip ---- */
#tabs{display:flex;gap:3px;padding:7px 8px 0;background:var(--bg2);align-items:flex-end;overflow-x:auto;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;max-width:210px;min-width:46px;padding:8px 9px 8px 13px;border-radius:12px 12px 0 0;background:transparent;color:var(--mut);flex:0 1 190px;cursor:pointer;position:relative;transition:background var(--speed),color var(--speed)}
.tab:hover{background:var(--panel);color:var(--fg)}
.tab.on{background:var(--panel);color:var(--fg)}
.tab .fv{width:15px;height:15px;flex:none;display:grid;place-items:center}
.tab .fv img{width:15px;height:15px;border-radius:3px}
.tab .tt{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;font-weight:500}
.tab .cl{width:19px;height:19px;border-radius:7px;display:grid;place-items:center;flex:none;opacity:.6}
.tab .cl:hover{background:var(--line2);opacity:1}
#newtab{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mut);flex:none;margin:0 2px 3px}
#newtab:hover{background:var(--panel);color:var(--acc2)}

/* ---- toolbar ---- */
#bar{display:flex;gap:4px;align-items:center;padding:8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--mut);font-size:17px;flex:none;transition:background var(--speed),color var(--speed),opacity var(--speed)}
.ib:hover{background:var(--panel2);color:var(--fg)}
.ib:disabled{opacity:.3;cursor:default}
.ib:active{transform:scale(.92)}
#omniwrap{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px;border-radius:999px;background:var(--bg2);border:1.5px solid var(--line);transition:border-color var(--speed),box-shadow var(--speed)}
#omniwrap.focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
#statusdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mut2);transition:background var(--speed);cursor:pointer;position:relative}
#statusdot.connecting{background:var(--warn);animation:pulse 1.2s ease-in-out infinite}
#statusdot.connected{background:var(--ok)}
#statusdot.offline,#statusdot.error{background:var(--err)}
@keyframes pulse{50%{opacity:.35}}
#omni{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:15px}
#omni::placeholder{color:var(--mut2)}
#omniclear{width:26px;height:26px;border-radius:50%;display:none;place-items:center;color:var(--mut);flex:none}
#omniclear:hover{background:var(--line2);color:var(--fg)}
#omniwrap.has #omniclear{display:grid}
#go{height:32px;padding:0 16px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-weight:700;display:flex;align-items:center;gap:6px;flex:none;transition:transform var(--speed),filter var(--speed)}
#go:hover{filter:brightness(1.06)}#go:active{transform:scale(.95)}
.actions{display:flex;gap:2px}

/* ---- announcement ---- */
#announce{display:none;align-items:center;gap:10px;padding:9px 14px;background:color-mix(in srgb,var(--info) 22%,var(--panel));color:var(--fg);font-size:13px;border-bottom:1px solid var(--line);flex:none}
#announce.on{display:flex}
#announce .ic{color:var(--info)}
#announce button{margin-left:auto;color:var(--mut)}

/* ---- main area ---- */
#main{flex:1;position:relative;min-height:0;background:var(--bg)}
iframe.view{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
iframe.view.on{display:block}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:28px;background:var(--bg);z-index:3}
.overlay.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.overlay .ic{color:var(--acc)}
.overlay h2{font-size:21px;font-weight:700}
.overlay p{color:var(--mut);max-width:440px;font-size:14px}
.overlay .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---- start page ---- */
#start{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;overflow:auto;padding:min(12vh,90px) 20px 48px}
#start.on{display:flex}
#start .logo{font-size:clamp(46px,9vw,84px);line-height:1;color:var(--acc3);text-shadow:3px 3px 0 var(--acc);letter-spacing:-.01em}
#start .tag{color:var(--mut);margin-top:8px;font-size:15px}
#sform{width:min(680px,100%);margin-top:30px;position:relative;display:flex;align-items:center}
#sform .si{position:absolute;left:20px;color:var(--mut2);pointer-events:none}
#sinput{width:100%;height:60px;border-radius:999px;border:2px solid var(--line2);background:var(--panel);padding:0 128px 0 52px;font-size:17px;outline:0;transition:border-color var(--speed),box-shadow var(--speed)}
#sinput:focus{border-color:var(--acc);box-shadow:0 0 0 5px color-mix(in srgb,var(--acc) 20%,transparent)}
#sgo{position:absolute;right:8px;height:44px;padding:0 22px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-weight:700;display:flex;align-items:center;gap:7px;transition:transform var(--speed),filter var(--speed)}
#sgo:hover{filter:brightness(1.06)}#sgo:active{transform:scale(.96)}
#statusline{margin-top:18px;display:flex;align-items:center;gap:9px;color:var(--mut);font-size:13px;padding:7px 15px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
#statusline .d{width:8px;height:8px;border-radius:50%;background:var(--mut2)}
#statusline.connected .d{background:var(--ok)}#statusline.connecting .d{background:var(--warn);animation:pulse 1.2s infinite}
#statusline.offline .d,#statusline.error .d{background:var(--err)}
.section{width:min(860px,100%);margin-top:34px}
.section h3{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 8px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);transition:transform var(--speed),background var(--speed),border-color var(--speed);position:relative}
.tile:hover{background:var(--panel2);transform:translateY(-3px);border-color:var(--line2)}
.tile .ig{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--bg2);color:var(--acc)}
.tile .ig img{width:24px;height:24px;border-radius:5px}
.tile .nm{font-size:12.5px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .rm{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:7px;display:none;place-items:center;color:var(--mut);background:var(--bg2)}
.tile:hover .rm{display:grid}.tile .rm:hover{color:var(--err);background:var(--line2)}
.empty{color:var(--mut2);font-size:13px;padding:8px 2px}
.privacy{width:min(860px,100%);margin-top:34px;padding:16px 18px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.privacy h3{margin-bottom:10px}
.privacy ul{list-style:none;display:grid;gap:7px}
.privacy li{display:flex;gap:9px;align-items:flex-start}
.privacy li .ic{flex:none;margin-top:1px}
.privacy .y{color:var(--ok)}.privacy .n{color:var(--err)}.privacy .i{color:var(--info)}

/* ---- drawer ---- */
#scrim{position:absolute;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity var(--speed);z-index:8}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--bg2);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:9;display:flex;flex-direction:column}
#drawer.on{transform:none}
#dh{display:flex;gap:3px;padding:12px 12px 0;flex:none}
#dh button{flex:1;padding:9px 6px;border-radius:11px 11px 0 0;color:var(--mut);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background var(--speed),color var(--speed)}
#dh button.on{background:var(--panel);color:var(--fg)}
#dh button:hover{color:var(--fg)}
#dclose{flex:none!important;width:40px;padding:9px 0}
#dc{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--panel)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12.5px;color:var(--mut);font-weight:600}
.fld input,.fld select{height:40px;border-radius:11px;border:1px solid var(--line2);background:var(--bg2);padding:0 12px;outline:0;transition:border-color var(--speed)}
.fld input:focus,.fld select:focus{border-color:var(--acc)}
.dh4{color:var(--mut);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.swrow{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:10px;border:2px solid transparent;position:relative;transition:transform var(--speed)}
.sw:hover{transform:scale(1.08)}.sw.on{border-color:var(--fg)}
.sw.on::after{content:"";position:absolute;inset:0;display:grid;place-items:center}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.toggle .tx{font-size:13.5px}.toggle .tx small{display:block;color:var(--mut2);font-size:11.5px;margin-top:2px}
.swt{width:44px;height:26px;border-radius:999px;background:var(--line2);position:relative;flex:none;transition:background var(--speed)}
.swt::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform var(--speed)}
.swt.on{background:var(--acc)}.swt.on::after{transform:translateX(18px)}
.btn{padding:10px 15px;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center;transition:filter var(--speed),transform var(--speed)}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.97)}
.btn.alt{background:var(--bg2);color:var(--fg);border:1px solid var(--line2)}
.btn.danger{background:color-mix(in srgb,var(--err) 20%,var(--bg2));color:var(--err);border:1px solid color-mix(in srgb,var(--err) 40%,transparent)}
.btn.sm{padding:8px 12px;font-size:13px}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);transition:border-color var(--speed)}
.item:hover{border-color:var(--line2)}
.item .fv{width:18px;height:18px;flex:none;display:grid;place-items:center}
.item .fv img{width:18px;height:18px;border-radius:4px}
.item .meta{flex:1;min-width:0;cursor:pointer}
.item .meta .t{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta .u{font-size:11.5px;color:var(--mut2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--mut);flex:none}
.item .x:hover{color:var(--err);background:var(--line2)}

/* ---- toast ---- */
#toast{position:absolute;bottom:22px;left:50%;transform:translate(-50%,16px);background:var(--panel);color:var(--fg);border:1px solid var(--line2);padding:10px 18px;border-radius:12px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:9px;opacity:0;pointer-events:none;transition:all var(--speed);z-index:20;box-shadow:var(--shadow);max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .ic{color:var(--acc2)}#toast.err .ic{color:var(--err)}

/* ---- loading bar ---- */
#loadbar{position:absolute;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));z-index:7;opacity:0;transition:width .3s ease,opacity .3s;box-shadow:0 0 8px var(--acc)}
#loadbar.on{opacity:1}

/* ---- maintenance ---- */
#maint{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:28px}
#maint.on{display:flex}
#maint .ic{color:var(--warn)}#maint h1{font-size:30px}#maint p{color:var(--mut);max-width:460px}

@media(max-width:620px){
.tab{flex-basis:140px}
#go span,#sgo span{display:none}#go,#sgo{padding:0 14px}
.ib{width:34px;height:34px}
.hidephone{display:none}
#home,#star,#cloak,#full{display:none}
#bar{gap:2px;padding:7px 6px}
#start{padding-top:40px}
}
</style>
</head>
<body>
<div id="loadbar"></div>
<div id="tabs"></div>
<div id="bar">
<div class="actions">
<button class="ib" id="back" title="Back" aria-label="Back"></button>
<button class="ib" id="fwd" title="Forward" aria-label="Forward"></button>
<button class="ib" id="reload" title="Reload" aria-label="Reload"></button>
<button class="ib" id="home" title="New tab page" aria-label="Home"></button>
</div>
<div id="omniwrap">
<span id="statusdot" title="Proxy status"></span>
<input id="omni" placeholder="Search or enter a URL" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" inputmode="url">
<button id="omniclear" title="Clear" aria-label="Clear"></button>
<button id="go">GO</button>
</div>
<div class="actions">
<button class="ib" id="star" title="Add to favorites" aria-label="Favorite"></button>
<button class="ib" id="cloak" title="Open in about:blank"></button>
<button class="ib" id="full" title="Fullscreen"></button>
<button class="ib" id="menu" title="Menu"></button>
</div>
</div>
<div id="announce"><span class="ic" data-ic="info"></span><span id="announce-t"></span><button id="announce-x" aria-label="Dismiss"></button></div>
<div id="main">
<div id="start"></div>
<div id="err" class="overlay"></div>
<div id="scrim"></div>
<div id="drawer"><div id="dh"></div><div id="dc"></div></div>
</div>
<div id="toast"></div>
<div id="maint"><span class="ic" data-ic="construction"></span><h1 class="brand">Under maintenance</h1><p id="maint-t"></p><div class="row"><button class="btn alt" id="maint-retry"><span data-ic="refresh"></span> Check again</button></div></div>

<script>
/* ========================= icons (inline Lucide) ========================= */
const ICONS={
back:'<polyline points="15 18 9 12 15 6"/>',fwd:'<polyline points="9 18 15 12 9 6"/>',

x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
go:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',

full:'<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
menu:'<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>',
plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
clock:'<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',
bookmark:'<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',

const API=(()=>{const w=window.CANDIFY_WISP;if(!w)return location.origin;try{return new URL(w).origin.replace(/^ws/,'http')}catch(e){return location.origin}})()

/* ========================= proxy status ========================= */
let proxyState='connecting',latency=null
function setState(s){proxyState=s;$('#statusdot').className=s;const sl=$('#statusline');if(sl)sl.className=s;renderStatusLine()}
function renderStatusLine(){const sl=$('#statusline');if(!sl)return
const label={connecting:'Connecting to proxy…',connected:'Proxy connected'+(latency!=null?' · '+latency+' ms':''),offline:'Backend offline',error:'Proxy error'}[proxyState]||''
sl.innerHTML='<span class="d"></span>'+ic(proxyState==='connected'?'globe':proxyState==='offline'?'wifioff':'gauge')+'<span>'+label+'</span>'}

const engineReady=STATIC?Promise.resolve():(async()=>{
const reg=await navigator.serviceWorker.register('/sw.js',{scope:C.prefix})
const w=reg.installing||reg.waiting||reg.active
if(w&&w.state!=='activated')await new Promise(r=>w.addEventListener('statechange',()=>{if(w.state==='activated')r()}))
const {BareMuxConnection}=await import('/baremux/index'+(window.CANDIFY_ESM||'.mjs'))
const conn=new BareMuxConnection('/baremux/worker.js')
const owner=localStorage.getItem('cdf.ownertoken')
await conn.setTransport('/epoxy/index'+(window.CANDIFY_ESM||'.mjs'),[{wisp:wispUrl()+(owner?'?owner='+owner:'')}])
})()

async function pingBackend(){
try{const t0=performance.now()
const r=await fetch(API+'/api/status',{cache:'no-store'})
latency=Math.round(performance.now()-t0)
if(!r.ok)throw 0
const d=await r.json()
if(d.maintenance&&!localStorage.getItem('cdf.ownertoken')){showMaintenance(d);return}
return d
}catch(e){latency=null;setState('offline');return null}
}
async function initEngine(){
setState('connecting')
try{await engineReady}catch(e){setState('error');showError('engine',e&&e.message);return}
if(STATIC||NOAPI){setState('connected');return}   // no /api to ping; proven on first real navigation
const ok=await pingBackend()
setState(ok?'connected':'offline')
}

/* ========================= tabs ========================= */
let tabs=[],cur=null,nid=1,watchdog={}
const isProxied=u=>u&&!u.startsWith(location.origin)&&!/^\/|^about:/.test(u)
function newTab(url){const t={id:nid++,title:'New Tab',url:'',icon:'',frame:null,loading:false};tabs.push(t);select(t);if(url)load(t,url);return t}
function closeTab(t){const i=tabs.indexOf(t);if(t.frame)t.frame.remove();tabs.splice(i,1);if(!tabs.length)return newTab();if(cur===t)cur=tabs[Math.min(i,tabs.length-1)];render()}
function select(t){cur=t;render();if(!t.frame)setTimeout(()=>$('#sinput')&&$('#sinput').focus(),30)}

function load(t,input){
const url=toUrl(input)
if(!url){return}
t.url=url;t.title=hostShort(url);t.loading=true
if(!t.frame){const f=document.createElement('iframe');f.className='view';f.allow='fullscreen;autoplay;gamepad;clipboard-write;microphone;camera;encrypted-media'
f.addEventListener('load',()=>onFrameLoad(t));$('#main').prepend(f);t.frame=f}
loadbar(true)
clearTimeout(watchdog[t.id])
watchdog[t.id]=setTimeout(()=>{if(t.loading){t.loading=false;loadbar(false);if(t===cur)showError('timeout',url)}},28000)
const f=t.frame
engineReady.then(()=>{f.src=(STATIC||url.startsWith(location.origin)||url.startsWith('/'))?url:C.prefix+C.encodeUrl(url)})
.catch(e=>{setState('error');showError('engine',e&&e.message)})
render()
}
function onFrameLoad(t){
t.loading=false;clearTimeout(watchdog[t.id]);if(t===cur)loadbar(false)
try{const w=t.frame.contentWindow,real=realUrl(w.location.pathname)
if(real){t.url=real;const d=w.document
// detect UV's internal error page
if(d.getElementById&&d.getElementById('errorTitle')&&d.title==='Error'){if(t===cur)showError('dest',real);return}
t.title=(d.title||hostShort(real)).slice(0,80);t.icon=favicon(real)
if(FEAT.history&&isProxied(real)){hist=hist.filter(h=>h.u!==real);hist.unshift({u:real,t:t.title,d:Date.now()});hist=hist.slice(0,300);saveHist()}
hideError()
}}catch(e){/* cross-origin: still proxied & fine */}
if(t===cur)setState('connected')
render()
}
function realUrl(src){const i=(src||'').indexOf(C.prefix);if(i<0)return src||'';try{return C.decodeUrl(src.slice(i+C.prefix.length))}catch(e){return ''}}
function hostShort(u){return u.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'').slice(0,60)}

/* ========================= URL handling / validation ========================= */
function toUrl(v){v=(v||'').trim();if(!v)return''
if(v==='about:blank')return'about:blank'
if(/^[a-z][a-z0-9+.-]*:\/\//i.test(v)){try{new URL(v);return v}catch(e){return S.engine.replace('%s',encodeURIComponent(v))}}
if(/^[^\s./]+\.[a-z]{2,}([/:?#].*)?$/i.test(v)||/^localhost(:\d+)?/.test(v)||/^\d{1,3}(\.\d{1,3}){3}/.test(v))return'https://'+v
return S.engine.replace('%s',encodeURIComponent(v))
}

/* ========================= loading bar ========================= */
let lbT
function loadbar(on){const b=$('#loadbar')
if(on){b.classList.add('on');b.style.width='18%';clearInterval(lbT);let w=18;lbT=setInterval(()=>{w+=Math.max(.5,(85-w)*.08);b.style.width=Math.min(w,85)+'%'},220)}
else{clearInterval(lbT);b.style.width='100%';setTimeout(()=>{b.classList.remove('on');b.style.width='0'},280)}}

function render(){

const ts=$('#tabs');ts.innerHTML=''
tabs.forEach(t=>{const d=document.createElement('div');d.className='tab'+(t===cur?' on':'')
d.innerHTML='<span class="fv">'+(t.loading?ic('refresh','spin'):(t.icon?'<img src="'+t.icon+'" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{innerHTML:\''+'\'}))">':ic('globe')))+'</span><span class="tt"></span><button class="cl" aria-label="Close">'+ic('x')+'</button>'
d.querySelector('.tt').textContent=t.title
d.onclick=()=>select(t);d.querySelector('.cl').onclick=e=>{e.stopPropagation();closeTab(t)}
d.onauxclick=e=>{if(e.button===1){e.preventDefault();closeTab(t)}}
ts.appendChild(d)})
const nb=document.createElement('button');nb.id='newtab';nb.title='New tab (Alt+T)';nb.innerHTML=ic('plus');nb.onclick=()=>newTab();ts.appendChild(nb)
// frames visibility
tabs.forEach(t=>{if(t.frame)t.frame.classList.toggle('on',t===cur)})
const home=cur&&!cur.frame
$('#start').classList.toggle('on',home)
if(home)renderStart()
// omnibox
const ow=$('#omniwrap'),om=$('#omni')
if(document.activeElement!==om){om.value=cur&&isProxied(cur.url)?cur.url:''}
ow.classList.toggle('has',!!om.value)
$('#back').disabled=$('#fwd').disabled=home
$('#star').innerHTML=ic(cur&&favorites.some(f=>f.u===cur.url)?'starf':'star')
$('#reload').innerHTML=ic(cur&&cur.loading?'x':'refresh')
}

function tile(name,url,removable,kind){
const b=document.createElement('button');b.className='tile'
const fi=favicon(url)
b.innerHTML='<span class="ig">'+(fi?'<img src="'+fi+'" onerror="this.parentNode.innerHTML=\''+'\'">':ic('globe'))+'</span><span class="nm"></span>'+(removable?'<span class="rm" title="Remove">'+ic('x')+'</span>':'')
b.querySelector('.nm').textContent=name||hostShort(url)

b.onclick=e=>{if(e.target.closest('.rm'))return;load(cur,url)}

renderStart()}

}

else inner+='<input type="text" value="'+String(val).replace(/"/g,'&quot;')+'">'
f.innerHTML=inner;const ctl=f.querySelector('select,input');ctl.onchange=()=>on(ctl.value);if(type==='text')ctl.oninput=()=>on(ctl.value);c.appendChild(f)}
function toggleRow(t,sub,on,fn){const d=el('div','toggle');d.innerHTML='<div class="tx">'+t+'<small>'+sub+'</small></div><div class="swt'+(on?' on':'')+'"></div>';d.querySelector('.swt').onclick=()=>{const s=!d.querySelector('.swt').classList.contains('on');d.querySelector('.swt').classList.toggle('on',s);fn(s)};c.appendChild(d)}
function mk(par,cls,icn,txt,fn){const b=el('button',cls);b.innerHTML=ic(icn)+'<span>'+txt+'</span>';b.onclick=fn;par.appendChild(b)}
function el(t,c){const e=document.createElement(t);if(c)e.className=c;return e}
}
function drawHistory(c){
if(!hist.length){c.innerHTML='<div class="empty">No history yet. Pages you visit show up here.</div>';return}
const top=document.createElement('button');top.className='btn alt sm';top.innerHTML=ic('trash')+'<span>Clear all history</span>';top.onclick=()=>{hist=[];saveHist();render();renderDrawer()};c.appendChild(top)
hist.forEach(h=>{const d=document.createElement('div');d.className='item'
d.innerHTML='<span class="fv"><img src="'+favicon(h.u)+'" onerror="this.replaceWith(document.createRange().createContextualFragment(\''+'\'))"></span><div class="meta"><div class="t"></div><div class="u"></div></div><button class="x">'+ic('trash')+'</button>'
d.querySelector('.t').textContent=h.t;d.querySelector('.u').textContent=hostShort(h.u)
d.querySelector('.meta').onclick=()=>{closeDrawer();load(cur,h.u)}
d.querySelector('.x').onclick=()=>{hist=hist.filter(x=>x.u!==h.u);saveHist();render();renderDrawer()}
c.appendChild(d)})
}
function drawFavorites(c){
const addrow=document.createElement('div');addrow.className='fld'
addrow.innerHTML='<label>Add current page</label>'
const b=document.createElement('button');b.className='btn sm';b.innerHTML=ic('star')+'<span>'+(cur&&isProxied(cur.url)?'Add "'+hostShort(cur.url)+'"':'Open a page first')+'</span>'
b.disabled=!(cur&&isProxied(cur.url));b.onclick=()=>{toggleFav();renderDrawer()};addrow.appendChild(b);c.appendChild(addrow)
if(!favorites.length){const e=document.createElement('div');e.className='empty';e.textContent='No favorites yet. Star a page to save it here.';c.appendChild(e);return}
favorites.forEach(f=>{const d=document.createElement('div');d.className='item'
d.innerHTML='<span class="fv"><img src="'+favicon(f.u)+'" onerror="this.style.display=\'none\'"></span><div class="meta"><div class="t"></div><div class="u"></div></div><button class="x">'+ic('trash')+'</button>'
d.querySelector('.t').textContent=f.n;d.querySelector('.u').textContent=hostShort(f.u)
d.querySelector('.meta').onclick=()=>{closeDrawer();load(cur,f.u)}
d.querySelector('.x').onclick=()=>{favorites=favorites.filter(x=>x.u!==f.u);saveFav();render();renderDrawer()}
c.appendChild(d)})
}
function toggleFav(){if(!cur||!isProxied(cur.url))return toast('Open a page first','err')
const i=favorites.findIndex(f=>f.u===cur.url)
if(i>=0){favorites.splice(i,1);toast('Removed from favorites')}else{favorites.push({n:cur.title.slice(0,40),u:cur.url});toast('Added to favorites')}
saveFav();render()}

/* ========================= about:blank cloak ========================= */
function openBlank(){const w=window.open('about:blank','_blank')
if(!w)return toast('Popup blocked — allow popups and try again','err')
const c=cloaks[S.cloak]||cloaks.none
w.document.title=c[0]||'about:blank';w.document.body.style.cssText='margin:0;height:100vh'
const f=w.document.createElement('iframe');f.src=location.origin+'/app.html';f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0';f.allow='fullscreen;autoplay;gamepad;clipboard-write'
w.document.body.appendChild(f);toast('Opened in about:blank')}

/* ========================= toolbar wiring ========================= */
$('#back').onclick=()=>{try{cur.frame.contentWindow.history.back()}catch(e){}}
$('#fwd').onclick=()=>{try{cur.frame.contentWindow.history.forward()}catch(e){}}
$('#reload').onclick=()=>{if(cur&&cur.loading){try{cur.frame.contentWindow.stop()}catch(e){}cur.loading=false;loadbar(false);render();return}try{cur.frame.contentWindow.location.reload()}catch(e){if(cur.url)load(cur,cur.url)}}
$('#home').onclick=()=>{if(cur.frame){cur.frame.remove();cur.frame=null}cur.url='';cur.title='New Tab';hideError();render()}
$('#star').onclick=toggleFav
$('#cloak').onclick=openBlank
$('#full').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
$('#menu').onclick=()=>panel&&$('#drawer').classList.contains('on')?closeDrawer():openDrawer('settings')
const om=$('#omni')
om.addEventListener('focus',()=>{$('#omniwrap').classList.add('focus');om.select()})
om.addEventListener('blur',()=>$('#omniwrap').classList.remove('focus'))
om.addEventListener('input',()=>$('#omniwrap').classList.toggle('has',!!om.value))
om.addEventListener('keydown',e=>{if(e.key==='Enter'){if(om.value.trim())load(cur,om.value);om.blur()}if(e.key==='Escape'){om.value=cur&&isProxied(cur.url)?cur.url:'';om.blur()}})
$('#go').onclick=()=>{if(om.value.trim())load(cur,om.value)}
$('#omniclear').onclick=()=>{om.value='';$('#omniwrap').classList.remove('has');om.focus()}
$('#announce-x').onclick=()=>$('#announce').classList.remove('on')

/* keyboard shortcuts */
document.addEventListener('keydown',e=>{
if(S.panicKey&&e.key===S.panicKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){try{(window.top||window).location.href=S.panicUrl}catch(x){location.href=S.panicUrl}return}
if(e.altKey){const k=e.key.toLowerCase()
if(k==='t'){e.preventDefault();newTab()}
if(k==='w'){e.preventDefault();closeTab(cur)}
if(k==='l'){e.preventDefault();om.focus()}
if(k==='r'){e.preventDefault();$('#reload').click()}
if(k==='d'){e.preventDefault();toggleFav()}}
})

/* ========================= remote config (site name, announce, maintenance, features) ========================= */
let FEAT={history:true,favorites:true,quickLaunch:true,cloak:true}
function cfgSiteName(){return (window.__cfg&&window.__cfg.siteName)||'Candify'}
function applyFeatures(){
$('#cloak').style.display=FEAT.cloak?'':'none'
$('#star').style.display=FEAT.favorites?'':'none'
}
async function loadRemoteConfig(){
if(STATIC||NOAPI)return   // no /api backend in these modes
try{const r=await fetch(API+'/api/config',{cache:'no-store'});if(!r.ok)return;const c=await r.json();window.__cfg=c
if(c.features)FEAT=Object.assign(FEAT,c.features)
applyFeatures()
// seed theme for first-time visitors who haven't chosen one
if(!store.get('settings',null)&&c.theme&&themes[c.theme]){S.theme=c.theme;applyTheme()}
if(c.maintenance&&!localStorage.getItem('cdf.ownertoken')){showMaintenance(c);return}
if(c.announcement){$('#announce-t').textContent=c.announcement;$('#announce').classList.add('on');paintIcons($('#announce'))}
if(document.title&&S.cloak==='none')document.title=cfgSiteName()
if(cur&&!cur.frame)renderStart()
}catch(e){}}

/* ========================= boot (auto-start, no launch button) ========================= */
paintIcons(document)
applyTheme()
newTab()                 // lands straight on the blank new-tab page, URL bar ready
initEngine()             // register SW + transport + ping backend in the background
loadRemoteConfig()
if(!STATIC&&!NOAPI)setInterval(pingBackend,20000)   // keep latency fresh + detect offline/maintenance
window.CANDIFY_VERSION='2.0.0'
</script>
</body>
