<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Candify</title>
<link id="fav" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<style>
:root{--bg:#17091f;--bg2:#1f0e2e;--panel:#2a1340;--line:#ffffff1a;--line2:#ffffff2e;--fg:#f6edff;--mut:#f6edffa8;--mut2:#f6edff66;--acc:#ff4fa3;--acc-ink:#1a0712;--acc2:#5ff2c4;--acc3:#ffe45c;--info:#6c8cff;--ok:#36d399;--warn:#ffb020;--err:#ff5c7a;--radius:16px;--speed:.16s;--shadow:0 18px 60px #0009}
:root[data-mode=light]{--bg:#f4eef9;--bg2:#ece3f5;--panel:#fff;--line:#2a123314;--line2:#2a123326;--fg:#24103a;--mut:#24103a9e;--mut2:#24103a5c;--acc-ink:#fff}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg));color:var(--fg);font:400 15px/1.5 Inter,system-ui,sans-serif;display:grid;place-items:center;overflow:hidden;padding:24px;-webkit-tap-highlight-color:transparent}
.brand{font-family:Fredoka,sans-serif;font-weight:700}
svg.ic{width:1.15em;height:1.15em;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

main{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;max-width:560px;width:100%;animation:rise .5s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* spinning lollipop */
.pop{width:min(42vw,170px);aspect-ratio:1;position:relative;filter:drop-shadow(0 16px 30px #0007)}
.pop .disc{width:100%;height:100%;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--acc) 0 24deg,var(--cream,#fff3e6) 24deg 48deg);box-shadow:0 0 0 8px var(--acc3),inset 0 0 22px #0004;animation:spin 16s linear infinite}
.pop::after{content:"";position:absolute;left:50%;top:94%;width:11px;height:40px;background:linear-gradient(var(--fg),transparent);transform:translateX(-50%);border-radius:0 0 6px 6px;opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}

h1{font-size:clamp(52px,12vw,104px);line-height:.95;color:var(--acc3);text-shadow:4px 4px 0 var(--acc);letter-spacing:-.01em}
.tag{color:var(--mut);font-size:16px;margin-top:10px}

#launch{font:600 20px Inter,sans-serif;display:inline-flex;align-items:center;gap:10px;padding:16px 40px;border:0;border-radius:999px;background:var(--acc);color:var(--acc-ink);cursor:pointer;box-shadow:0 8px 0 color-mix(in srgb,var(--acc) 55%,#000),0 18px 40px #0006;transition:transform .09s,box-shadow .09s,filter var(--speed)}
#launch:hover{filter:brightness(1.06)}
#launch:active{transform:translateY(6px);box-shadow:0 2px 0 color-mix(in srgb,var(--acc) 55%,#000),0 8px 20px #0006}
#launch:focus-visible{outline:3px solid var(--acc3);outline-offset:4px}
#launch svg{width:22px;height:22px}

.status{display:inline-flex;align-items:center;gap:9px;color:var(--mut);font-size:13px;padding:7px 15px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.status .d{width:8px;height:8px;border-radius:50%;background:var(--mut2);transition:background var(--speed)}
.status.ok .d{background:var(--ok)}.status.bad .d{background:var(--err)}.status.wait .d{background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}

.msg{min-height:20px;font-size:13.5px;color:var(--warn)}
.msg a{color:var(--acc2);font-weight:600}
.feats{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;color:var(--mut2);font-size:12.5px;margin-top:2px}
.feats span{display:inline-flex;align-items:center;gap:6px}
.feats svg{width:14px;height:14px;color:var(--acc2)}
.owner{position:fixed;bottom:16px;right:18px;color:var(--mut2);font-size:12px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;opacity:.6;transition:opacity var(--speed)}
.owner:hover{opacity:1;color:var(--fg)}.owner svg{width:13px;height:13px}

/* maintenance */
#maint{display:none;flex-direction:column;align-items:center;gap:16px;text-align:center}
#maint.on{display:flex}#maint .ic{color:var(--warn);width:52px;height:52px}
</style>
</head>
<body>
<main id="home">
<div class="pop"><div class="disc"></div></div>
<div>
<h1 class="brand" id="title">Candify</h1>
<div class="tag" id="tag">Fast, private proxy — opens in an about:blank tab</div>
</div>
<button id="launch"><svg viewBox="0 0 24 24"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>Launch</button>
<div class="status wait" id="status"><span class="d"></span><span id="statust">Checking proxy…</span></div>
<div class="msg" id="msg"></div>
<div class="feats">
<span><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Tabs &amp; favorites</span>
<span><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Header unblocking</span>
<span><svg viewBox="0 0 24 24"><path d="M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a13 13 0 0 1-1.7 2.7"/><path d="M6.6 6.6A13 13 0 0 0 2 12s3 8 10 8a9 9 0 0 0 5.4-1.6"/><line x1="2" y1="2" x2="22" y2="22"/></svg>Tab cloak</span>
</div>
</main>

<main id="maint">
<svg class="ic" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="8" rx="1"/><path d="M17 14v7M7 14v7M17 3v3M7 3v3M2 10h20"/></svg>
<h1 class="brand" style="font-size:40px">Under maintenance</h1>
<p class="tag" id="maint-t" style="max-width:420px"></p>
<button id="launch2" style="font:600 16px Inter;padding:12px 28px;border:0;border-radius:999px;background:var(--panel);color:var(--fg);border:1px solid var(--line2);cursor:pointer;display:inline-flex;gap:8px;align-items:center"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>Check again</button>
</main>

<a class="owner" href="/admin.html" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Owner</a>

<script>
const $=s=>document.querySelector(s)
const STATIC=!!window.CANDIFY_STATIC
const NOAPI=!!window.CANDIFY_NOAPI
const API=(()=>{const w=window.CANDIFY_WISP;if(!w)return location.origin;try{return new URL(w).origin.replace(/^ws/,'http')}catch(e){return location.origin}})()
if(NOAPI){const o=document.querySelector('.owner');if(o)o.style.display='none'}
const APP=location.origin+'/app.html'
let cloak={title:'about:blank',icon:''}
try{const s=JSON.parse(localStorage.getItem('cdf.settings')||'{}')
const cl={classroom:['Classes','https://ssl.gstatic.com/classroom/favicon.png'],docs:['Untitled document - Google Docs','https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico'],drive:['My Drive - Google Drive','https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png'],canvas:['Dashboard','https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico']}
if(s.cloak&&cl[s.cloak])cloak={title:cl[s.cloak][0],icon:cl[s.cloak][1]}
if(s.mode==='light')document.documentElement.dataset.mode='light'}catch(e){}

function launch(){
const msg=$('#msg');msg.textContent=''
let w
try{w=window.open('about:blank','_blank')}catch(e){}
if(!w){
msg.innerHTML='Popup blocked — <a href="'+APP+'">open Candify here</a> instead, or allow popups and click Launch again.'
return
}
try{
w.document.open()
w.document.write('<!doctype html><html><head><title>'+cloak.title.replace(/[<>]/g,'')+'</title>'
+(cloak.icon?'<link rel="icon" href="'+cloak.icon+'">':'')
+'<style>html,body{margin:0;height:100%;background:#17091f;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head>'
+'<body><iframe src="'+APP+'" allow="fullscreen;autoplay;gamepad;clipboard-write;microphone;camera;encrypted-media"></iframe></body></html>')
w.document.close()
msg.innerHTML='Opened in a new about:blank tab. <a href="'+APP+'">Not opening?</a>'
}catch(e){
// fallback: plain iframe injection
try{w.document.title=cloak.title;const f=w.document.createElement('iframe');f.src=APP;f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0';f.allow='fullscreen;autoplay;gamepad;clipboard-write';w.document.body.style.margin='0';w.document.body.appendChild(f)}
catch(x){location.href=APP}
}
}
$('#launch').onclick=launch
$('#launch2').onclick=()=>location.reload()

// status + remote config (site name, maintenance)
async function check(){
const st=$('#status'),t=$('#statust')
if(STATIC){st.className='status ok';t.textContent='Ready (static mode)';return}
if(NOAPI){st.className='status ok';t.textContent='Proxy ready';return}   // Workers Wisp: no /api to probe
try{const r=await fetch(API+'/api/status',{cache:'no-store'});const d=await r.json()
if(d.maintenance){showMaint();return}
st.className='status ok';t.textContent='Proxy online'+(d.version?' · v'+d.version:'')
}catch(e){st.className='status bad';t.textContent='Backend offline — Launch may not load pages'}
}
async function conf(){
if(STATIC||NOAPI)return
try{const r=await fetch(API+'/api/config',{cache:'no-store'});const c=await r.json()
if(c.siteName){$('#title').textContent=c.siteName;document.title=cloak.title==='about:blank'?c.siteName:cloak.title}
if(c.maintenance){showMaint(c);return}
}catch(e){}
}
function showMaint(c){$('#home').style.display='none';$('#maint').classList.add('on')
$('#maint-t').textContent=(c&&c.maintenanceMsg)||'Candify is down for a quick tune-up. Check back soon.'}

// keyboard: Enter / Space launches
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&document.activeElement.tagName!=='A'){e.preventDefault();launch()}})
check();conf()
</script>
</body>
</html>
